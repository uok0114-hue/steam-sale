<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>스팀 게임 가격 조회기</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            text-align: center;
            background-color: #1b2838;
            color: white;
        }

        .card {
            background: #171a21;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #66c0f4;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
        }

        button:hover {
            background: #417a9b;
            color: white;
        }

        .price {
            font-size: 24px;
            color: #a4d007;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>🎮 스팀 게임 가격 조회기</h1>
    <p>버튼을 누르면 스팀 서버에서 실시간 가격 정보를 가져옵니다!</p>

    <button id="fetch-btn">팰월드 가격 확인하기</button>

    <div class="card">
        <h2 id="game-title">게임 제목</h2>
        <div id="game-price" class="price">버튼을 눌러주세요</div>
    </div>

    <script>
        const fetchBtn = document.getElementById('fetch-btn');
        const gameTitle = document.getElementById('game-title');
        const gamePrice = document.getElementById('game-price');

        fetchBtn.addEventListener('click', function () {
            gamePrice.textContent = "스팀 서버에서 가져오는 중...";

            // 실제 배포 환경에서 가장 잘 작동하는 corsproxy.io 우회 주소
            const targetUrl = 'https://store.steampowered.com/api/appdetails?appids=1623730&cc=kr';
            const steamUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

            fetch(steamUrl)
                .then(function (response) {
                    if (!response.ok) throw new Error('네트워크 응답 이상');
                    return response.json();
                })
                .then(function (data) {
                    // corsproxy.io는 스팀 원본 JSON을 그대로 전달해 줍니다.
                    const palworldData = data['1623730'].data;

                    const title = palworldData.name;
                    const priceString = palworldData.price_overview ? palworldData.price_overview.final_formatted : '무료 게임 또는 가격 정보 없음';

                    gameTitle.textContent = title;
                    gamePrice.textContent = priceString;
                })
                .catch(function (error) {
                    console.error('에러 상세 정보:', error);
                    gamePrice.textContent = "가격을 불러오지 못했습니다 😢";
                });
        });
    </script>
</body>

</html>
