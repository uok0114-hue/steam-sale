<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스팀 실시간 게임 가격 검색기</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-card: rgba(22, 28, 38, 0.75);
            --bg-card-hover: rgba(30, 38, 52, 0.85);
            --steam-blue: #66c0f4;
            --steam-dark-blue: #1b2838;
            --steam-accent: #3b82f6;
            --neon-green: #a4d007;
            --discount-bg: rgba(76, 107, 34, 0.35);
            --text-main: #f3f4f6;
            --text-muted: #8f98a0;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(102, 192, 244, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 85% 30%, rgba(102, 192, 244, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1240px;
        }

        /* 📌 헤더 영역 */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge-capsule {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(102, 192, 244, 0.1);
            border: 1px solid rgba(102, 192, 244, 0.25);
            border-radius: 20px;
            color: var(--steam-blue);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 14px;
            backdrop-filter: blur(8px);
        }

        .header h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #66c0f4 60%, #a4d007 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* 📌 검색 바 통합 디자인 */
        .search-section {
            max-width: 680px;
            margin: 0 auto 35px auto;
        }

        .search-bar-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 6px 6px 6px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-bar-wrapper:focus-within {
            border-color: var(--steam-blue);
            box-shadow: 0 0 25px rgba(102, 192, 244, 0.35);
        }

        .search-icon {
            font-size: 18px;
            color: var(--text-muted);
            margin-right: 12px;
            user-select: none;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
        }

        .search-input::placeholder {
            color: #5c6878;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 10px;
            display: none;
            transition: color 0.2s;
        }

        .clear-btn:hover {
            color: #ffffff;
        }

        .btn-search {
            background: linear-gradient(135deg, #66c0f4 0%, #3b82f6 100%);
            color: #0b0e14;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 192, 244, 0.4);
            color: #ffffff;
        }

        .btn-search:active {
            transform: translateY(0);
        }

        /* 📌 퀵 태그/칩 (Quick Chips) */
        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: rgba(102, 192, 244, 0.15);
            border-color: rgba(102, 192, 244, 0.4);
            color: var(--steam-blue);
            transform: translateY(-2px);
        }

        /* 📌 상태 메시지 및 헤더 */
        .status-bar {
            text-align: center;
            font-size: 15px;
            color: var(--steam-blue);
            margin-bottom: 25px;
            min-height: 24px;
            font-weight: 600;
        }

        /* 📌 검색 결과 카드 그리드 */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--border-glow);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(102, 192, 244, 0.15);
            background: var(--bg-card-hover);
        }

        /* 썸네일 & 할인 뱃지 오버레이 */
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 145px;
            overflow: hidden;
            background-color: #121721;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img {
            transform: scale(1.07);
        }

        .badge-discount {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(76, 107, 34, 0.9);
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            font-size: 13px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .badge-free {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 192, 244, 0.9);
            color: #0b0e14;
            font-size: 12px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        /* 카드 콘텐츠 */
        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .game-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 43px;
        }

        .price-box {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .original-price {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-bottom: 2px;
        }

        .final-price {
            font-size: 21px;
            font-weight: 800;
            color: var(--neon-green);
        }

        .final-price.free {
            color: var(--steam-blue);
        }

        .final-price.none {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        /* 스팀 버튼 */
        .btn-steam {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            background: rgba(102, 192, 244, 0.08);
            border: 1px solid rgba(102, 192, 244, 0.25);
            border-radius: 10px;
            color: var(--steam-blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-steam:hover {
            background: var(--steam-blue);
            color: #0b0e14;
            box-shadow: 0 4px 12px rgba(102, 192, 244, 0.3);
        }

        /* 📌 스켈레톤 로딩 애니메이션 (Shimmer Effect) */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .skeleton-card {
            background: var(--bg-card);
            border-radius: 16px;
            height: 310px;
            border: 1px solid var(--border-glass);
            overflow: hidden;
            position: relative;
        }

        .skeleton-shimmer {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.05) 50%, 
                transparent 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* 📌 Empty State UI */
        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 📌 헤더 영역 -->
        <header class="header">
            <div class="badge-capsule">
                <span>⚡</span> 스팀 실시간 원화 가격 검색기
            </div>
            <h1>🎮 STEAM PRICE SEARCH</h1>
            <p>한글 줄임말이나 게임 이름을 검색하면 스팀 실시간 할인 가격을 한눈에 확인합니다.</p>
        </header>

        <!-- 📌 통합 검색 바 -->
        <section class="search-section">
            <div class="search-bar-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="게임 이름 또는 줄임말 입력 (예: 몬헌, 사펑, 팰월드, GTA)" value="팰월드" autocomplete="off">
                <button id="clear-btn" class="clear-btn" title="검색어 지우기">✕</button>
                <button id="search-btn" class="btn-search">검색</button>
            </div>

            <!-- Quick Chips -->
            <div class="quick-chips">
                <span class="chip" onclick="quickSearch('팰월드')">#팰월드</span>
                <span class="chip" onclick="quickSearch('몬헌')">#몬헌</span>
                <span class="chip" onclick="quickSearch('사펑')">#사펑</span>
                <span class="chip" onclick="quickSearch('배그')">#배그</span>
                <span class="chip" onclick="quickSearch('레데리')">#레데리</span>
                <span class="chip" onclick="quickSearch('GTA')">#GTA</span>
                <span class="chip" onclick="quickSearch('스카이림')">#스카이림</span>
                <span class="chip" onclick="quickSearch('엘든링')">#엘든링</span>
            </div>
        </section>

        <!-- 📌 검색 상태 안내 -->
        <div id="status-bar" class="status-bar">검색어를 입력하고 검색 버튼을 누르세요.</div>

        <!-- 📌 검색 결과 목록 그리드 컨테이너 -->
        <main id="games-grid" class="games-grid"></main>
    </div>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusBar = document.getElementById('status-bar');
        const gamesGrid = document.getElementById('games-grid');

        // 입력 상태에 따른 Clear(X) 버튼 토글
        searchInput.addEventListener('input', () => {
            clearBtn.style.display = searchInput.value.trim() ? 'block' : 'none';
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.focus();
        });

        // 퀵 태그 클릭 검색
        function quickSearch(term) {
            searchInput.value = term;
            clearBtn.style.display = 'block';
            searchGame();
        }

        // 스켈레톤 로딩 렌더링
        function renderSkeletons(count = 6) {
            gamesGrid.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const skel = document.createElement('div');
                skel.className = 'skeleton-card';
                skel.innerHTML = '<div class="skeleton-shimmer"></div>';
                gamesGrid.appendChild(skel);
            }
        }

        // Empty State 렌더링
        function renderEmptyState(keyword) {
            gamesGrid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🕹️</div>
                    <h3>'${keyword}' 검색 결과를 찾을 수 없습니다</h3>
                    <p>철자를 확인하시거나 상단의 추천 태그(#몬헌, #사펑 등)를 클릭해 보세요.</p>
                </div>
            `;
        }

        // 메인 검색 함수
        async function searchGame() {
            const keyword = searchInput.value.trim();
            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            statusBar.textContent = "🔍 스팀 서버에서 실시간 정보를 검색 중입니다...";
            renderSkeletons(6);

            try {
                // 1단계: 백엔드 API에서 검색 키워드로 목록 조회
                const searchRes = await fetch(`/api?type=search&term=${encodeURIComponent(keyword)}`);
                const searchData = await searchRes.json();

                if (!searchData.items || searchData.items.length === 0) {
                    statusBar.textContent = "";
                    renderEmptyState(keyword);
                    return;
                }

                // 부하 방지를 위해 상위 12개 결과로 제한
                const targetItems = searchData.items.slice(0, 12);
                statusBar.textContent = `🎮 총 ${targetItems.length}개의 관련 게임을 찾았습니다. 상세 가격 정보 조회 중...`;

                // 2단계: 각 게임별 상세 가격/이미지 병렬 조회
                const cardPromises = targetItems.map(async (item) => {
                    const appId = item.id;
                    let title = item.name;
                    let imgUrl = item.tiny_image || `https://shared.fastly.steamstatic.com/store_images_cdn/steam/apps/${appId}/header.jpg`;
                    let isFree = false;
                    let finalPrice = "출시 예정 / 가격 미정";
                    let originalPrice = "";
                    let discountPercent = 0;
                    const steamStoreUrl = `https://store.steampowered.com/app/${appId}`;

                    try {
                        const priceRes = await fetch(`/api?appid=${appId}`);
                        if (priceRes.ok) {
                            const priceData = await priceRes.json();
                            const detail = priceData[appId]?.data;

                            if (detail) {
                                title = detail.name || title;
                                if (detail.header_image) imgUrl = detail.header_image;

                                isFree = detail.is_free;
                                if (isFree) {
                                    finalPrice = "무료 플레이 (Free)";
                                } else if (detail.price_overview) {
                                    finalPrice = detail.price_overview.final_formatted;
                                    discountPercent = detail.price_overview.discount_percent || 0;
                                    if (discountPercent > 0) {
                                        originalPrice = detail.price_overview.initial_formatted;
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`AppId ${appId} price fetch error:`, e);
                    }

                    return { appId, title, imgUrl, isFree, finalPrice, originalPrice, discountPercent, steamStoreUrl };
                });

                const results = await Promise.all(cardPromises);
                statusBar.textContent = `✨ '${keyword}' 검색 결과 (총 ${results.length}개)`;
                gamesGrid.innerHTML = '';

                // 3단계: 완성된 카드 DOM 생성
                results.forEach(res => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    // 뱃지 오버레이 HTML
                    let badgeHtml = '';
                    if (res.discountPercent > 0) {
                        badgeHtml = `<div class="badge-discount">🔥 -${res.discountPercent}%</div>`;
                    } else if (res.isFree) {
                        badgeHtml = `<div class="badge-free">FREE</div>`;
                    }

                    // 가격 정보 HTML
                    let priceHtml = '';
                    if (res.isFree) {
                        priceHtml = `<div class="final-price free">무료 플레이</div>`;
                    } else if (res.originalPrice) {
                        priceHtml = `
                            <div class="original-price">${res.originalPrice}</div>
                            <div class="final-price">${res.finalPrice}</div>
                        `;
                    } else if (res.finalPrice.includes('₩') || res.finalPrice.includes('Free') || res.finalPrice.includes('무료')) {
                        priceHtml = `<div class="final-price">${res.finalPrice}</div>`;
                    } else {
                        priceHtml = `<div class="final-price none">${res.finalPrice}</div>`;
                    }

                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img class="card-img" src="${res.imgUrl}" alt="${res.title}" onerror="this.src='https://shared.fastly.steamstatic.com/store_images_cdn/steam/apps/${res.appId}/header.jpg'">
                            ${badgeHtml}
                        </div>
                        <div class="card-content">
                            <h3 class="game-title" title="${res.title}">${res.title}</h3>
                            <div class="price-box">
                                ${priceHtml}
                                <a href="${res.steamStoreUrl}" target="_blank" rel="noopener noreferrer" class="btn-steam">
                                    🛒 스팀 상점 바로가기 ➔
                                </a>
                            </div>
                        </div>
                    `;
                    gamesGrid.appendChild(card);
                });

            } catch (error) {
                console.error('검색 중 오류 발생:', error);
                statusBar.textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
                gamesGrid.innerHTML = '';
            }
        }

        // 이벤트 리스너 등록
        searchBtn.addEventListener('click', searchGame);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchGame();
        });

        // 초기 1회 팰월드 검색 수행
        searchGame();
    </script>
</body>

</html>
